<h1 mat-dialog-title>{{ 'admin.addEntityMapping.title' | translate }}</h1>
<div mat-dialog-content>
  <form [formGroup]="formControl">
    <mat-form-field appearance="fill" [style.width]="'80%'">
      <mat-label>{{ 'common.label.name' | translate }}</mat-label>
      <input matInput type="text" required formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="fill" [style.width]="'20%'">
      <mat-label>{{ 'common.label.type' | translate }}</mat-label>
      <mat-select formControlName="type">
        @for (format of this.mappingFormats(); track format) {
          <mat-option [value]="format">
            {{format}}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill" [style.width]="'100%'">
      <mat-label>{{ 'common.label.description' | translate }}</mat-label>
      <textarea matInput  formControlName="description"></textarea>
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions>
  <button mat-button color="primary" (click)="save()">{{ 'common.action.save' | translate }}</button>
</div>
