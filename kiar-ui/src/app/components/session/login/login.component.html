<mat-card appearance="outlined">
  <mat-card-title>{{ 'common.action.login' | translate }}</mat-card-title>
  <mat-card-content>
    <form [formGroup]="form">
      <p>
        <mat-form-field>
          <mat-label>{{ 'common.label.username' | translate }}</mat-label>
          <input type="text" matInput [placeholder]="'common.label.username' | translate" formControlName="username" autocomplete="username" />
        </mat-form-field>
      </p>

      <p>
        <mat-form-field>
          <mat-label>{{ 'common.label.password' | translate }}</mat-label>
          <input type="password" matInput [placeholder]="'common.label.password' | translate" formControlName="password" autocomplete="current-password" />
        </mat-form-field>
      </p>

      <div class="button">
        <button type="submit" mat-button color="primary" (click)="submit()">{{ 'common.action.login' | translate }}</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
